<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엘리베이터로 배우는 디자인패턴 — step1~8 데이터 흐름 시뮬레이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#060814; --surface:rgba(255,255,255,0.04); --surface-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.15);
    --text:#F8FAFC; --muted:#94A3B8; --dim:#475569;
    --indigo:#818CF8; --indigo-deep:#4F46E5; --amber:#FBBF24; --rose:#F43F5E;
    --emerald:#34D399; --cyan:#22D3EE; --lime:#A3E635; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;color:var(--text);
    background:radial-gradient(ellipse at top left,rgba(99,102,241,0.12),transparent 50%),
      radial-gradient(ellipse at bottom right,rgba(244,63,94,0.08),transparent 50%),var(--bg);
    min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1500px;margin:0 auto;padding:34px 36px 70px;}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;
    background:linear-gradient(135deg,rgba(251,191,36,0.18),rgba(251,191,36,0.06));color:var(--amber);
    font-size:0.85rem;font-weight:600;border:1px solid rgba(251,191,36,0.25);}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}
  h1{font-size:2.2rem;font-weight:800;letter-spacing:-0.03em;margin:16px 0 6px;}
  .accent{background:linear-gradient(120deg,var(--rose),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:1.0rem;margin:0;}
  .tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:24px 0 20px;}
  @media(max-width:1100px){.tabs{grid-template-columns:repeat(4,1fr);}}
  .tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:13px;
    padding:11px 6px;cursor:pointer;transition:.18s;font-family:inherit;text-align:center;font-size:0.84rem;line-height:1.3;}
  .tab small{display:block;font-size:0.7rem;color:var(--dim);font-family:var(--mono);}
  .tab:hover{transform:translateY(-2px);color:var(--text);}
  .tab.active{background:linear-gradient(135deg,rgba(244,63,94,0.16),rgba(251,191,36,0.08));
    border-color:rgba(244,63,94,0.4);color:var(--text);}
  .tab.active small{color:var(--amber);}
  .panel{display:none;} .panel.active{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .phead h2{font-size:1.4rem;font-weight:700;margin:0;}
  .pdesc{color:var(--muted);font-size:0.94rem;line-height:1.55;margin:6px 0 16px;max-width:960px;}
  .pdesc b{color:var(--amber);} .pdesc i{color:var(--indigo);font-style:normal;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 400px;gap:16px;}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr;}}
  .stage{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px 12px;overflow:hidden;}
  .sidecard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;}
  .codebox{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);border-radius:10px;
    padding:9px 12px;font-family:var(--mono);font-size:0.73rem;color:var(--amber);min-height:40px;line-height:1.5;word-break:break-all;}
  .codelabel{font-size:0.7rem;color:var(--dim);font-weight:700;letter-spacing:.06em;margin-bottom:5px;}
  .controls-row{display:flex;gap:8px;align-items:center;margin:12px 0 10px;}
  .btn{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
    border-radius:11px;padding:9px 14px;font-size:0.84rem;font-weight:700;cursor:pointer;
    transition:.15s;font-family:inherit;}
  .btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--indigo);}
  .btn:disabled{opacity:.35;cursor:default;}
  .btn.amber{background:linear-gradient(135deg,rgba(251,191,36,0.22),rgba(251,191,36,0.08));border-color:rgba(251,191,36,0.5);}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--muted);}
  .prog{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:0.75rem;}
  .console{background:#04060F;border:1px solid var(--border);border-radius:12px;padding:10px 12px;
    height:236px;overflow-y:auto;font-family:var(--mono);font-size:0.72rem;line-height:1.6;}
  .console .ctitle{color:var(--dim);font-size:0.66rem;letter-spacing:.08em;margin-bottom:4px;}
  .cline{white-space:pre-wrap;color:#C7D2FE;animation:pop .3s ease;}
  .cline.sep{color:var(--dim);}
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .verdict{margin-top:12px;border-radius:12px;padding:11px 13px;font-size:0.85rem;line-height:1.5;
    border:1px solid var(--border);background:var(--surface-2);color:var(--muted);}
  .verdict.ok{border-color:rgba(52,211,153,0.4);background:rgba(52,211,153,0.1);color:#bbf7d0;}
  .verdict.bad{border-color:rgba(244,63,94,0.4);background:rgba(244,63,94,0.1);color:#fecdd3;}
  .verdict.warn{border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.08);color:#fde68a;}
  .flow-msg{font-size:0.9rem;line-height:1.5;color:var(--muted);min-height:44px;margin-top:8px;}
  .flow-msg b{color:var(--text);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:0.72rem;margin-top:6px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .lg{display:inline-block;width:20px;height:0;border-top:2.4px solid;}
  .lg.dash{border-top-style:dashed;}
  .hint{color:var(--dim);font-size:0.83rem;margin-top:13px;line-height:1.5;}
  .hint b{color:var(--muted);}
  svg{display:block;width:100%;height:auto;}
  svg text{font-family:'Pretendard Variable',Pretendard,sans-serif;user-select:none;}
  svg .mono-t{font-family:var(--mono);}
  .nbox{fill:rgba(255,255,255,0.045);stroke:rgba(255,255,255,0.18);stroke-width:1.2;transition:.25s;}
  .nfocus .nbox{stroke:#FBBF24;stroke-width:2;filter:drop-shadow(0 0 6px rgba(251,191,36,.45));}
  .nbad .nbox{stroke:#F43F5E;stroke-width:2;filter:drop-shadow(0 0 6px rgba(244,63,94,.5));}
  .flowline{stroke-dasharray:7 5;animation:dashmv .7s linear infinite;}
  @keyframes dashmv{to{stroke-dashoffset:-12;}}
  .alabel{font-size:11.5px;font-weight:700;paint-order:stroke;stroke:#0A0E1E;stroke-width:4px;}
  .pick{stroke:#A3E635 !important;stroke-width:2.4 !important;filter:drop-shadow(0 0 7px rgba(163,230,53,.7));}
  .steprow{fill:rgba(255,255,255,0.05);stroke:rgba(255,255,255,0.14);stroke-width:1;transition:.25s;}
  .steprow.on{fill:rgba(251,191,36,0.16);stroke:#FBBF24;stroke-width:1.6;}
  .steprow.done{fill:rgba(52,211,153,0.09);stroke:rgba(52,211,153,0.4);}
  .slotrow{fill:rgba(251,191,36,0.05);stroke:rgba(251,191,36,0.45);stroke-width:1.2;stroke-dasharray:5 4;transition:.25s;}
  .slotrow.on{fill:rgba(251,191,36,0.22);filter:drop-shadow(0 0 8px rgba(251,191,36,.6));}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge"><span class="dot"></span>인터랙티브 · 디자인패턴</div>
  <h1>엘리베이터로 배우는 <span class="accent">디자인패턴</span> 시뮬레이터</h1>
  <p class="sub">step1 → step8. 같은 건물, 같은 엘베(E1·E2·E3)가 패턴을 하나씩 얻는다 — <b>▶ 다음</b>을 눌러 코드 실행의 데이터 흐름을 눈으로 확인하세요.</p>
  <div class="tabs" id="tabbar"></div>
  <div id="panels"></div>
</div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const C={amber:'#FBBF24',indigo:'#818CF8',rose:'#F43F5E',emerald:'#34D399',cyan:'#22D3EE',lime:'#A3E635',muted:'#94A3B8',dim:'#64748B'};
function sEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(x,y,str,attrs,parent){const t=sEl('text',Object.assign({x,y},attrs),parent);t.textContent=str;return t;}

/* ---------- 시뮬 엔진 ---------- */
function makeSim(idx,cfgFn){
  const root=document.querySelector('.panel[data-panel="'+idx+'"]');
  const svg=root.querySelector('svg');
  const msg=root.querySelector('.flow-msg'), codebox=root.querySelector('.codebox'),
        cons=root.querySelector('.console'), verd=root.querySelector('.verdict'),
        prog=root.querySelector('.prog');
  const btnNext=root.querySelector('.b-next'), btnAuto=root.querySelector('.b-auto'), btnReset=root.querySelector('.b-reset');
  let cfg, fi, timer=null, cars={}, nodes={}, layers={}, markers={};

  function floorY(f){return cfg.shaft.yBase-(f-1)*cfg.shaft.fh;}
  function carX(col){return cfg.shaft.x0+44+col*cfg.shaft.colW;}
  function carH(){return cfg.shaft.fh-8;}

  function marker(color){
    const key=color.replace('#','');
    if(markers[key])return markers[key];
    const id='ah'+idx+'-'+key;
    const m=sEl('marker',{id,viewBox:'0 0 10 10',refX:'8.5',refY:'5',markerWidth:'6.5',markerHeight:'6.5',orient:'auto-start-reverse'},layers.defs);
    sEl('path',{d:'M0,0L10,5L0,10z',fill:color},m);
    markers[key]='url(#'+id+')'; return markers[key];
  }
  function anchor(ref){
    if(ref.startsWith('car:')){const c=cars[ref.slice(4)];return {x:c.x+41,y:c.y-3,w:1,h:1};}
    if(ref.startsWith('col:')){const c=cars[ref.slice(4)];const top=floorY(cfg.shaft.floors)-carH();return {x:c.x+41,y:top-16,w:1,h:1};}
    const n=nodes[ref];return {x:n.x,y:n.y,w:n.w,h:n.h};
  }
  function edge(b,tx,ty){
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    if(b.w<=2)return {x:cx,y:cy};
    const dx=tx-cx, dy=ty-cy;
    const sx=dx!==0?(b.w/2)/Math.abs(dx):1e9, sy=dy!==0?(b.h/2)/Math.abs(dy):1e9;
    const s=Math.min(sx,sy,1);
    return {x:cx+dx*s,y:cy+dy*s};
  }
  function drawArrow(spec,parent){
    const A=anchor(spec.f),B=anchor(spec.t);
    const ac={x:A.x+A.w/2,y:A.y+A.h/2},bc={x:B.x+B.w/2,y:B.y+B.h/2};
    const p1=edge(A,bc.x,bc.y),p2=edge(B,ac.x,ac.y);
    const col=spec.c||C.amber;
    const ln=sEl('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:col,
      'stroke-width':spec.thin?1.4:2.3,'marker-end':marker(col)},parent);
    if(spec.ret)ln.setAttribute('stroke-dasharray','5 4');
    else if(!spec.solid)ln.classList.add('flowline');
    if(spec.label){
      const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2-7;
      txt(mx,my,spec.label,{'text-anchor':'middle',fill:col,'class':'alabel'},parent);
    }
  }
  function drawNode(n){
    const g=sEl('g',{'data-node':n.id},layers.nodes);
    sEl('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:12,'class':'nbox'},g);
    const hasSubs=n.subs&&n.subs.length;
    txt(n.x+n.w/2,n.y+(hasSubs?21:n.h/2+4.5),n.title,{'text-anchor':'middle',fill:'#F8FAFC','font-size':'13px','font-weight':'700'},g);
    n.subEls=[];
    if(hasSubs)n.subs.forEach((s,i)=>{
      n.subEls.push(txt(n.x+n.w/2,n.y+40+i*17,s,{'text-anchor':'middle',fill:'#94A3B8','font-size':'10.5px','class':'mono-t'},g));
    });
    if(n.steps){
      const x=n.x+14,w=n.w-28;let y=n.y+36;n.stepEls=[];
      n.steps.forEach(s=>{
        const r=sEl('rect',{x,y,width:w,height:32,rx:8,'class':'steprow'},g);
        txt(x+w/2,y+20,s,{'text-anchor':'middle',fill:'#CBD5E1','font-size':'11px','class':'mono-t'},g);
        n.stepEls.push(r);y+=40;
      });
      if(n.slotRow){
        y+=4;
        n.slotEl=sEl('rect',{x,y,width:w,height:34,rx:8,'class':'slotrow'},g);
        txt(x+w/2,y+21,n.slotRow,{'text-anchor':'middle',fill:'#FBBF24','font-size':'10.5px','class':'mono-t'},g);
      }
    }
    n.g=g;
  }
  function drawShaft(){
    const s=cfg.shaft;
    if(!s)return;
    sEl('line',{x1:s.x0-14,y1:34,x2:s.x0-14,y2:466,stroke:'rgba(255,255,255,0.07)','stroke-width':1},layers.shaft);
    txt(s.x0+160,26,'🏢 건물 (현재 층 = 위치)',{'text-anchor':'middle',fill:'#64748B','font-size':'11px'},layers.shaft);
    for(let f=1;f<=s.floors;f++){
      const y=floorY(f);
      sEl('line',{x1:s.x0+26,y1:y,x2:945,y2:y,stroke:'rgba(255,255,255,0.07)','stroke-width':1},layers.shaft);
      txt(s.x0+4,y+3.5,f+'F',{fill:'#475569','font-size':'9.5px','class':'mono-t'},layers.shaft);
    }
  }
  function addCar(c){
    const x=carX(c.col),h=carH(),y=floorY(c.floor)-h-1;
    const g=sEl('g',{},layers.cars);
    g.style.transform='translate('+x+'px,'+y+'px)';
    g.style.transition='transform 0.9s cubic-bezier(.45,0,.25,1), opacity .4s';
    const kc=c.kind==='고속'?{f:'rgba(251,191,36,0.15)',s:'#FBBF24'}:c.kind==='일반'?{f:'rgba(129,140,248,0.16)',s:'#818CF8'}:{f:'rgba(255,255,255,0.08)',s:'rgba(255,255,255,0.35)'};
    const rect=sEl('rect',{x:0,y:0,width:82,height:h,rx:7,fill:kc.f,stroke:kc.s,'stroke-width':1.3},g);
    const label=c.label||(c.name+(c.kind?'·'+c.kind:''));
    const small=h<28;
    txt(41,small?11:h/2-2,label,{'text-anchor':'middle',fill:'#F8FAFC','font-size':small?'9.5px':'11px','font-weight':'700'},g);
    let loadEl=null;
    if(c.load!=null)loadEl=txt(41,small?21:h/2+11,'load '+c.load,{'text-anchor':'middle',fill:'#94A3B8','font-size':small?'8.5px':'9.5px','class':'mono-t'},g);
    cars[c.name]={x,y,g,rect,loadEl,floor:c.floor,col:c.col};
  }
  function applyFrame(f){
    layers.arrows.innerHTML='';layers.tags.innerHTML='';
    Object.values(nodes).forEach(n=>{n.g.classList.remove('nfocus','nbad');});
    if(f.carAdd)f.carAdd.forEach(addCar);
    if(f.move){const c=cars[f.move.car];c.floor=f.move.floor;c.y=floorY(f.move.floor)-carH()-1;
      c.g.style.transform='translate('+c.x+'px,'+c.y+'px)';}
    if(f.loads)Object.keys(f.loads).forEach(k=>{if(cars[k].loadEl)cars[k].loadEl.textContent='load '+f.loads[k];});
    if(f.pick!==undefined){Object.values(cars).forEach(c=>c.rect.classList.remove('pick'));
      if(f.pick)cars[f.pick].rect.classList.add('pick');}
    if(f.tags)f.tags.forEach(t=>{const c=cars[t.car];
      txt(c.x+41,c.y-8,t.txt,{'text-anchor':'middle',fill:t.c||C.cyan,'font-size':'11px','font-weight':'700','class':'alabel mono-t'},layers.tags);});
    if(f.sub)f.sub.forEach(s=>{nodes[s.node].subEls[s.i].textContent=s.text;});
    if(f.addLink)f.addLink.forEach(l=>drawArrow(Object.assign({thin:true,c:C.dim,solid:true},l),layers.links));
    if(f.arrows)f.arrows.forEach(a=>drawArrow(a,layers.arrows));
    if(f.focus)f.focus.forEach(id=>nodes[id].g.classList.add('nfocus'));
    if(f.bad)f.bad.forEach(id=>nodes[id].g.classList.add('nbad'));
    if(f.steps){const n=nodes[f.steps.node];
      if(f.steps.reset||f.steps.idx===0)n.stepEls.forEach(r=>r.classList.remove('on','done'));
      if(f.steps.idx!=null)n.stepEls.forEach((r,i)=>{r.classList.toggle('on',i===f.steps.idx);r.classList.toggle('done',i<f.steps.idx);});
      if(n.slotEl)n.slotEl.classList.toggle('on',!!f.slotFlash);}
    else if(f.slotFlash){const n=nodes[f.slotFlash];if(n.slotEl)n.slotEl.classList.add('on');}
    if(f.out)f.out.forEach(line=>{const d=document.createElement('div');
      d.className='cline'+(line.startsWith('---')?' sep':'');d.textContent=line;cons.appendChild(d);cons.scrollTop=cons.scrollHeight;});
    if(f.code)codebox.textContent=f.code;
    if(f.say)msg.innerHTML=f.say;
    if(f.verdict){verd.className='verdict '+f.verdict.cls;verd.innerHTML=f.verdict.text;}
  }
  function next(){
    if(fi>=cfg.frames.length)return;
    applyFrame(cfg.frames[fi]);fi++;
    prog.textContent=fi+' / '+cfg.frames.length;
    if(fi>=cfg.frames.length){btnNext.disabled=true;stopAuto();
      msg.innerHTML+=' <span style="color:var(--emerald)">— 실행 끝 ✅ (↺로 다시)</span>';}
  }
  function stopAuto(){if(timer){clearInterval(timer);timer=null;btnAuto.textContent='⏭ 자동 재생';}}
  function build(){
    stopAuto();cfg=cfgFn();fi=0;cars={};nodes={};markers={};
    svg.innerHTML='';
    layers={defs:sEl('defs',{},svg),links:sEl('g',{},svg),shaft:sEl('g',{},svg),
      cars:sEl('g',{},svg),nodes:sEl('g',{},svg),arrows:sEl('g',{},svg),tags:sEl('g',{},svg)};
    drawShaft();
    if(cfg.shaft&&cfg.shaft.cars)cfg.shaft.cars.forEach(addCar);
    if(cfg.curtain){const cu=cfg.curtain;
      sEl('rect',{x:cu.x,y:cu.y,width:cu.w,height:cu.h,rx:16,fill:'rgba(129,140,248,0.03)',stroke:'rgba(129,140,248,0.3)','stroke-width':1.2,'stroke-dasharray':'7 6'},layers.shaft);
      txt(cu.x+cu.w/2,cu.y+cu.h-10,cu.label,{'text-anchor':'middle',fill:'#64748B','font-size':'10.5px'},layers.shaft);}
    cfg.nodes.forEach(n=>{nodes[n.id]=n;drawNode(n);});
    cons.innerHTML='<div class="ctitle">CONSOLE — System.out</div>';
    codebox.textContent='— 대기 —';
    verd.className='verdict';verd.textContent='이 단계의 포인트는 실행이 끝나면 나타납니다.';
    msg.innerHTML='▶ <b>다음</b>을 눌러 코드를 한 줄씩 실행해 보세요.';
    prog.textContent='0 / '+cfg.frames.length;
    btnNext.disabled=false;
  }
  btnNext.addEventListener('click',next);
  btnAuto.addEventListener('click',()=>{
    if(timer){stopAuto();return;}
    if(fi>=cfg.frames.length)build();
    btnAuto.textContent='⏸ 정지';timer=setInterval(()=>{next();},1500);
  });
  btnReset.addEventListener('click',build);
  build();
  return {stopAuto};
}
/* ---------- 패널 메타 + DOM 생성 ---------- */
const META=[
 {tab:'① step1<small>OOP 복습</small>',h2:'① step1 — OOP 복습: 엘베에게 "일을 시킨다"',
  desc:'엘베 한 대. 층(<i>currentFloor</i>)은 private으로 감추고, <b>내부호출(행위)</b>로만 바뀐다. 밖에서는 시키고 물어볼 수만 있다 — <b>Tell, Don&#39;t Ask</b>.',
